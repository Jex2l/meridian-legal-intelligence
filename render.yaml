# Render Blueprint for the backend API only. Deploy by connecting this repo
# in the Render dashboard ("New +" -> "Blueprint") with rootDir set so Render
# finds this file, or create a single Web Service manually with the same
# settings (see docs/DEPLOYMENT.md for the full walkthrough, including the
# env vars that must be set by hand in the dashboard rather than here, since
# they're secrets this file should never contain).
services:
  - type: web
    name: meridian-legal-backend
    runtime: python
    plan: free
    rootDir: backend
    # Installs the CPU-only torch wheel FIRST, from PyTorch's own CPU
    # index. The default PyPI `torch` (what plain `pip install -r
    # requirements.txt` pulls in as a transitive dependency of
    # sentence-transformers) is the GPU/CUDA build, which bundles ~1GB of
    # NVIDIA libraries that are useless on a GPU-less host but still get
    # loaded into memory -- confirmed live, this alone was enough to blow
    # a 512MB instance's RAM during model loading. Installing the CPU
    # wheel first means `pip install -r requirements.txt` finds torch
    # already satisfied and never fetches the CUDA build.
    buildCommand: "pip install torch==2.9.1+cpu --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt"
    startCommand: "uvicorn app.api.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      # Secrets and deployment-specific values (DATABASE_URL, GROQ_API_KEY,
      # SECRET_KEY, CORS_ALLOWED_ORIGINS, UPLOAD_DIR) are set in the Render
      # dashboard's Environment tab, not here -- see docs/DEPLOYMENT.md.
